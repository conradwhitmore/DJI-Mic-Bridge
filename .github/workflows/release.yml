name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Cross-compile both installers from Intel to avoid the constrained arm64 pool.
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/MicBridge/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid app version'; exit 1; }
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo 'The tag must match the version in Resources/MicBridge/Info.plist.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          python3 --version
      - name: Offline checks
        run: |
          python3 scripts/check-public-privacy.py
          python3 -m unittest discover -s scripts/tests -p 'test_public_privacy.py' -v
          python3 scripts/check-micbridge-transport.py
          swift test
          python3 -m unittest discover -s scripts/diagnostics/tests -v
      - name: Build and verify Apple Silicon and Intel installers
        run: bash scripts/build-micbridge-release.sh
      - name: Verify release checksums
        working-directory: dist/releases/${{ steps.version.outputs.version }}
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Include release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp packaging/micbridge/release-notes.md "dist/releases/$VERSION/RELEASE-NOTES.md"
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridge-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/releases/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Release publication is restricted to version-tag builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MicBridge-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: release
      - name: Verify downloaded artifacts
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish development preview
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Retry an interrupted draft, but never silently replace a published release.
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' existing-release.json >/dev/null || {
              echo 'This release is already published. Use a new version tag.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "MicBridge $VERSION — 开发测试预览版" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "MicBridge-$VERSION-AppleSilicon.pkg" "MicBridge-$VERSION-Intel.pkg" \
            MicBridgeAudio-Source.tar.gz INSTALL.txt LICENSE THIRD_PARTY_NOTICES.md SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file RELEASE-NOTES.md
