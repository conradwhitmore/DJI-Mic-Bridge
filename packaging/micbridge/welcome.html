<h2>安装 MicBridge</h2>
<p>此安装包包含 MicBridge App 和 MicBridge Audio 音频组件，无需另外安装 BlackHole。</p>
<p>安装前请从菜单退出 MicBridge。安装完成后重新启动 Mac。</p>
<p>在 MicBridge 中连接 SPP 后会自动向音频组件输出；在 Typeless、会议或录音软件中选择 <b>MicBridge Audio</b> 作为输入。</p>
<p>已有 BlackHole 和录音文件会保留。</p>
</body></html>
